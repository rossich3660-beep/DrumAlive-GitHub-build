name: Build DrumAlive VST3 (Windows x64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        run: cmake --build build --config Release --target DrumAlive_VST3 --parallel

      - name: Package plugin
        shell: pwsh
        run: |
          $plugin = "build/DrumAlive_artefacts/Release/VST3/DrumAlive.vst3"
          if (!(Test-Path $plugin)) { throw "VST3 bundle not found at $plugin" }
          Compress-Archive -Path $plugin -DestinationPath "DrumAlive-Windows-x64-VST3.zip" -Force

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrumAlive-Windows-x64-VST3
          path: DrumAlive-Windows-x64-VST3.zip
          if-no-files-found: error
